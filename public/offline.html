<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)" />
    <title>Offline · AG Workspace</title>
    <script>
      // Stessa scelta di Impostazioni → Aspetto (chiave "ag-theme"); senza scelta segue il dispositivo.
      (function () {
        try {
          var p = localStorage.getItem("ag-theme");
          if (p === "light" || p === "dark") document.documentElement.className = p;
        } catch (e) {}
      })();
    </script>
    <style>
      /* Pagina statica (servita dal service worker senza rete): i colori replicano
         le palette di globals.css — "Carta" (chiaro) e "Grafite" (scuro). */
      :root {
        color-scheme: light;
        --bg: #f9f7f4; --fg: #141414; --muted: #66645e; --primary: #ff6b00; --on-primary: #141414;
        --ink: #141414; --orange: #ff6b00;
      }
      :root.dark {
        color-scheme: dark;
        --bg: #141414; --fg: #f2f1ec; --muted: #a3a29c; --ink: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          color-scheme: dark;
          --bg: #141414; --fg: #f2f1ec; --muted: #a3a29c; --ink: #ffffff;
        }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box;
        background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 360px; text-align: center; }
      svg { display: block; width: 120px; height: 52px; margin: 0 auto 24px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
      button {
        min-height: 44px; padding: 0 24px; border: 0; border-radius: 10px;
        font: inherit; font-weight: 600; background: var(--primary); color: var(--on-primary);
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Simbolo AG (stesse forme di public/brand/simbolo-colori-su-*.svg) -->
      <svg viewBox="-22 -2 240 104" aria-label="AG Workspace" role="img">
        <defs>
          <mask id="ag" maskUnits="userSpaceOnUse" x="-200" y="-200" width="700" height="500">
            <rect x="-200" y="-200" width="700" height="500" fill="#fff" />
            <polygon fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="miter" points="-14,58 61.2,58 67.6,76 -26,76" />
          </mask>
        </defs>
        <g transform="translate(25 0) skewX(-14)">
          <g mask="url(#ag)" style="fill: var(--ink); stroke: var(--ink)" stroke-width="0.6">
            <polygon points="0,100 34,0 66,0 100,100 76,100 50,26 24,100" />
            <polygon points="92.5,78 96,78 118,100 100,100" />
            <polygon points="190,0 118,0 96,22 96,78 118,100 186,100 186,44 140,44 140,62 164,62 164,78 128,78 118,68 118,32 128,22 184,22" />
          </g>
          <polygon style="fill: var(--orange)" points="-14,58 61.2,58 67.6,76 -26,76" />
        </g>
      </svg>
      <h1>Sei offline</h1>
      <p>Riprova quando torna la connessione.</p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>

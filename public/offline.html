<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B2149" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121C2E" media="(prefers-color-scheme: dark)" />
    <title>Offline · AG Workspace</title>
    <script>
      // Stessa scelta di Impostazioni → Aspetto (chiave "ag-theme"); senza scelta segue il dispositivo.
      (function () {
        try {
          var p = localStorage.getItem("ag-theme");
          if (p === "light" || p === "dark") document.documentElement.className = p;
        } catch (e) {}
      })();
    </script>
    <style>
      /* Pagina statica (servita dal service worker senza rete): i colori replicano
         le palette di globals.css — B "Navy club" (chiaro) e C "Notte blu" (scuro). */
      :root {
        color-scheme: light;
        --bg: #f4f6fa; --fg: #13203a; --muted: #5e6c84; --primary: #0b5fd9; --on-primary: #ffffff;
      }
      :root.dark {
        color-scheme: dark;
        --bg: #0b1220; --fg: #e8eef8; --muted: #93a3bc; --primary: #4c8dff; --on-primary: #0b1220;
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          color-scheme: dark;
          --bg: #0b1220; --fg: #e8eef8; --muted: #93a3bc; --primary: #4c8dff; --on-primary: #0b1220;
        }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box;
        background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 360px; text-align: center; }
      svg { display: block; width: 64px; height: 64px; margin: 0 auto 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
      button {
        min-height: 44px; padding: 0 24px; border: 0; border-radius: 10px;
        font: inherit; font-weight: 600; background: var(--primary); color: var(--on-primary);
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Logo AG Workspace (stessa geometria di components/brand/logo-geometry.ts) -->
      <svg viewBox="0 0 100 100" aria-label="AG Workspace" role="img">
        <rect width="100" height="100" rx="22" fill="#0B2149" />
        <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 73 L30 27 L46 73" />
          <path d="M83.08 38.61 A18.5 18.5 0 1 0 85.4 57.52 L85.4 51 L71 51" />
        </g>
        <circle cx="24.5" cy="62" r="1.9" fill="#7FB0FF" />
        <circle cx="30" cy="62" r="1.9" fill="#7FB0FF" />
        <circle cx="35.5" cy="62" r="1.9" fill="#7FB0FF" />
        <circle cx="30" cy="27" r="5" fill="#4C8DFF" />
        <circle cx="14" cy="73" r="5" fill="#4C8DFF" />
        <circle cx="46" cy="73" r="5" fill="#4C8DFF" />
      </svg>
      <h1>Sei offline</h1>
      <p>Riprova quando torna la connessione.</p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
